# Jalankan SEKALI SAJA (tab Actions > "Buat Keystore Play Store" > Run workflow).
# Hasilnya file teks berisi 4 nilai yang harus dimasukkan ke
# Settings > Secrets and variables > Actions. Setelah itu HAPUS artifact-nya
# dan SIMPAN file tersebut baik-baik (kunci untuk update aplikasi di Play Store).
name: Buat Keystore Play Storehttps://github.com/sandiariwijaya/safari_maulid/tree/main

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Buat keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore upload.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Safari Maulid, OU=Majlis Safari Maulid, O=Yayasan Majlis Safari Maulid, L=Madiun, ST=Jawa Timur, C=ID"
          mkdir out
          cp upload.jks out/upload.jks
          {
            echo "Masukkan ke GitHub: Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_PASSWORD      = $PASS"
            echo "KEY_ALIAS         = upload"
            echo ""
            echo "KEYSTORE_BASE64 = (isi seluruh teks di bawah garis, satu baris panjang)"
            echo "------------------------------------------------------------"
            base64 -w 0 upload.jks
            echo ""
          } > out/SECRETS-KEYSTORE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-safari-maulid-RAHASIA
          path: out/
          retention-days: 1
