name: Build APK Safari Maulid

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Siapkan proyek Android
        run: |
          flutter create --org id.web --project-name safarimaulid --platforms android .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons

      - name: Pasang keystore (jika ada)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KS_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build AAB untuk Play Store
        if: env.KEYSTORE_BASE64 != ''
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Ganti nama file
        run: |
          mkdir -p hasil
          cp build/app/outputs/flutter-apk/app-release.apk "hasil/SafariMaulid-${{ github.run_number }}.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "hasil/SafariMaulid-${{ github.run_number }}-playstore.aab"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SafariMaulid-build-${{ github.run_number }}
          path: hasil/
