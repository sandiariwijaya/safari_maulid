name: safarimaulid
description: Aplikasi Safari Maulid Karesidenan Madiun - membuka website https://safarimaulid.web.id secara online
publish_to: 'none'

# 1.1.0 = versi tampil. versionCode otomatis = nomor build GitHub.
version: 1.5.4+11

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#6B1010"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 21
